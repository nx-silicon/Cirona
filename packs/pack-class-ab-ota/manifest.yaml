# pack-class-ab-ota

name: pack-class-ab-ota
version: 1.0.0
manifest_schema_version: v4-1.1
tier: 1

description: |
  Class-AB output stage 2-stage opamp 设计知识包：架构组合（Stage1 5T NMOS-input + Stage2 class-AB push-pull floating-bias output stage，~22 MOSFET 总数）+ Miller compensation 补偿策略 + bias headroom 分析 + AC 稳定性 testbench 写法。覆盖 floating bias 偏置链拓扑选型、push-pull 输出 sizing、driver current 平衡的常见踩坑（VBPC/VBNC 节点漂移导致 bias 失锁等）。

